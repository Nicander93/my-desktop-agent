schemaVersion: 1
benchmark: desktop-workload-benchmark
version: 0.1.0
design:
  goal: Evaluate and improve the Desktop Agent on common, reproducible, real-world
    desktop workloads.
  task_count: 36
  domains: 12
  primary_levels:
  - D1
  - D2
  - D3
  principles:
  - user-goal-first
  - implementation-path-neutral
  - execution-based-verification
  - input-integrity
  - hidden-variant-tests
  - diagnostic-task-family
domains:
- id: personal-productivity
  code: PP
  title: 个人生产力
  tasks:
  - id: PP-001
    title: Downloads Organizer
    difficulty: D2
    user_goal: 整理杂乱的下载目录，按内容类型分类，识别重复文件，生成操作清单；默认不删除文件。
    capabilities:
    - filesystem
    - inspect
    - hash
    - plan
    - verify
    expected_artifacts:
    - organized/
    - manifest.json
    - duplicates.json
    core_checks:
    - dry-run 无副作用
    - 文件哈希保持
    - 无覆盖和删除
    - 清单与实际一致
    status: designed
    implementation_wave: 2
  - id: PP-002
    title: Photo Library Organizer
    difficulty: D2
    user_goal: 根据照片拍摄时间整理家庭或旅行照片；处理缺失 EXIF、重名和非图片文件。
    capabilities:
    - filesystem
    - metadata
    - batch
    - rename
    - verify
    expected_artifacts:
    - photos-by-date/
    - manifest.csv
    - warnings.json
    core_checks:
    - 日期分组正确
    - 缺失 EXIF 有明确策略
    - 重名不覆盖
    - 非图片不误处理
    status: designed
    implementation_wave: 2
  - id: PP-003
    title: Personal Archive Builder
    difficulty: D2
    user_goal: 将一批多年文档按年份和类型归档，生成索引并保留原件。
    capabilities:
    - filesystem
    - classify
    - archive
    - manifest
    - verify
    expected_artifacts:
    - archive/
    - archive-index.csv
    - archive-report.md
    core_checks:
    - 原件不变
    - 分类规则可解释
    - 压缩包可解压
    - 索引完整
    status: designed
    implementation_wave: 2
- id: knowledge-work
  code: KW
  title: 知识工作
  tasks:
  - id: KW-001
    title: Multi-document Brief
    difficulty: D2
    user_goal: 阅读多份 PDF/Markdown/TXT 材料，输出去重后的主题摘要、关键事实和待办事项。
    capabilities:
    - document-read
    - synthesis
    - citation
    - report
    - verify
    expected_artifacts:
    - brief.md
    - sources.json
    core_checks:
    - 事实可追溯到输入
    - 重复内容被合并
    - 不引入材料外事实
    - 输出结构完整
    status: designed
    implementation_wave: 2
  - id: KW-002
    title: Meeting Minutes
    difficulty: D2
    user_goal: 从会议转写稿生成会议摘要、决策、行动项、负责人和截止日期表。
    capabilities:
    - text-analysis
    - entity-extraction
    - table
    - report
    - verify
    expected_artifacts:
    - minutes.md
    - actions.csv
    core_checks:
    - 行动项来自原文
    - 负责人/日期不臆造
    - 决策与讨论区分
    - 表格字段完整
    status: designed
    implementation_wave: 1
  - id: KW-003
    title: Research Digest
    difficulty: D2
    user_goal: 将一组文章摘要、笔记和链接清单整理成主题化周报，标记冲突观点和待核实信息。
    capabilities:
    - document-read
    - cluster
    - synthesis
    - uncertainty
    - verify
    expected_artifacts:
    - digest.md
    - evidence-map.json
    core_checks:
    - 观点分组合理
    - 冲突观点保留
    - 不确定项明确
    - 证据映射有效
    status: designed
    implementation_wave: 2
- id: data-processing
  code: DP
  title: 数据处理
  tasks:
  - id: DP-001
    title: Messy CSV Cleaner
    difficulty: D2
    user_goal: 清洗一份真实风格 CSV：列名、空格、日期、数值、重复记录和异常行。
    capabilities:
    - structured-data
    - code
    - cli
    - execute
    - verify
    expected_artifacts:
    - cleaned.csv
    - invalid_rows.csv
    - report.json
    core_checks:
    - 行数守恒
    - 去重规则正确
    - 异常行完整
    - 输入未修改
    status: designed
    implementation_wave: 1
  - id: DP-002
    title: Multi-source Data Merge
    difficulty: D2
    user_goal: 合并客户、订单和产品三份数据，处理未匹配键、重复键和字段冲突。
    capabilities:
    - structured-data
    - join
    - code
    - report
    - verify
    expected_artifacts:
    - merged.csv
    - unmatched.csv
    - report.json
    core_checks:
    - 关联语义正确
    - 左表顺序保持
    - 冲突字段明确
    - 统计与输出一致
    status: designed
    implementation_wave: 2
  - id: DP-003
    title: Reusable Format Converter
    difficulty: D2
    user_goal: 编写参数化工具，将 JSON/CSV/YAML 中至少两种格式互转，并保留嵌套结构或给出明确降维规则。
    capabilities:
    - code
    - cli
    - schema
    - batch
    - verify
    expected_artifacts:
    - converter/
    - converted/
    - README.md
    - report.json
    core_checks:
    - 隐藏文件名可用
    - 参数不写死
    - 转换可逆性合理
    - 非法输入隔离
    status: designed
    implementation_wave: 2
- id: software-development
  code: SD
  title: 软件开发
  tasks:
  - id: SD-001
    title: Real Repository Bug Fix
    difficulty: D2
    user_goal: 在给定小型真实仓库中根据 issue 修复缺陷，不修改测试，并通过现有测试。
    capabilities:
    - repo-inspect
    - code-edit
    - test
    - diff
    - verify
    expected_artifacts:
    - source patch
    - test results
    core_checks:
    - 复现缺陷
    - 测试通过
    - 保护文件未改
    - 修改范围最小
    status: designed
    implementation_wave: 1
  - id: SD-002
    title: Incremental Feature
    difficulty: D2
    user_goal: 在现有应用中实现一个小型但跨层的功能，例如筛选、导出或配置项，并补充测试。
    capabilities:
    - repo-inspect
    - planning
    - code-edit
    - test
    - verify
    expected_artifacts:
    - feature implementation
    - tests
    - usage note
    core_checks:
    - 需求行为完整
    - 无回归
    - 边界测试
    - 无无关重构
    status: designed
    implementation_wave: 2
  - id: SD-003
    title: Dependency Upgrade
    difficulty: D2
    user_goal: 升级一个受控依赖版本，处理破坏性 API 变化并保持构建与测试通过。
    capabilities:
    - dependency
    - repo-inspect
    - migration
    - test
    - verify
    expected_artifacts:
    - updated manifests
    - source changes
    - migration note
    core_checks:
    - 锁文件一致
    - 无降级绕过
    - 测试通过
    - 变更说明准确
    status: designed
    implementation_wave: 2
- id: office-automation
